# 构建插件前端（dist/）+ native cdylib（lib/）并打包校验。
# 触发：push 到 main、PR、手动。
#
# 本插件是「前端 web + Rust native cdylib」混合模式：
#   - web 前端：build-web.mjs 安装依赖后 vite build → dist/（需 Node）。
#   - native cdylib：build-native 矩阵在 Windows/macOS/Linux 上 cargo build --release，
#     产出宿主约定的文件名 lib/Windows.dll、lib/macOS.dylib、lib/Linux.so。
#   - build 作业把三者合并进 lib/，再 pack + verify，确保 PR / push 就能抓出 native 编译与打包错误。
name: build-plugin

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-native:
    name: native ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: Windows
            libname: otools_easel_native.dll
            outname: Windows.dll
          - os: macos-latest
            target: macOS
            libname: libotools_easel_native.dylib
            outname: macOS.dylib
          - os: ubuntu-latest
            target: Linux
            libname: libotools_easel_native.so
            outname: Linux.so
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            native -> native/target
      - name: Build cdylib
        working-directory: native
        run: cargo build --release
      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p staging
          cp "native/target/release/${{ matrix.libname }}" "staging/${{ matrix.outname }}"
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: staging/${{ matrix.outname }}
          if-no-files-found: error

  build:
    name: pack & verify
    needs: build-native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: 下载 native 三平台构件
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          merge-multiple: true
          path: native-libs

      - name: 放置 native 构件到 lib/
        shell: bash
        run: |
          mkdir -p lib
          mv native-libs/* lib/
          ls -la lib/

      - name: 构建 dist/
        run: node scripts/build-web.mjs

      - name: 打包正式插件并生成摘要
        run: node scripts/pack-plugin.mjs --out dist-pack

      - name: 独立验证插件包
        run: node scripts/verify-plugin.mjs dist-pack

      - uses: actions/upload-artifact@v4
        with:
          name: oplg
          path: |
            dist-pack/*.oplg
            dist-pack/plugin.json
            dist-pack/logo.svg
            dist-pack/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
